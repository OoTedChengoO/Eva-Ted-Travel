            const minutes = Math.floor((diff / 1000 / 60) % 60);

                                                ${iconHtml}
                                                <span>${todo.text}</span>
                                            </div>
                                        </div>
                                        <button onclick="deleteTodo(${todo.id})" class="text-gray-300 hover:text-rose-500 p-1.5 rounded-lg transition flex-shrink-0" title="刪除">
                                            ✕
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                return;
            }

            let accommodationHtml = '';
            if (data.accommodationUrl) {
                accommodationHtml = `
                    <div class="bg-amber-50/90 border-2 border-amber-200 rounded-2xl p-4 mb-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 shadow-sm">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">🏠</span>
                            <div>
                                <span class="bg-amber-300 text-amber-900 text-[11px] font-black px-2.5 py-0.5 rounded-full mb-1 inline-block">住宿資訊</span>
                                <h4 class="font-bold text-gray-800 text-sm md:text-base">${data.accommodation}</h4>
                            </div>
                        </div>
                        <button onclick="openModal('url-modal')" class="bg-white hover:bg-amber-100 text-amber-900 border-2 border-amber-300 text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-sm">
                            <span>🐭</span>
                            <span>查看住宿 3 大亮點</span>
                        </button>
                    </div>
                `;
            } else if (data.accommodation) {
                accommodationHtml = `
                    <div class="bg-pink-50/80 border-2 border-pink-200 rounded-2xl p-4 mb-5 flex items-center gap-3 shadow-sm">
                        <span class="text-3xl">🏠</span>
                        <div>
                            <span class="bg-pink-300 text-rose-900 text-[11px] font-black px-2.5 py-0.5 rounded-full mb-1 inline-block">住宿地點</span>
                            <h4 class="font-bold text-gray-800 text-sm md:text-base">${data.accommodation}</h4>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="bg-white/95 rounded-3xl p-5 md:p-6 border-3 border-pink-200 shadow-lg mb-6">
                    <div class="flex flex-wrap justify-between items-center gap-2 mb-5 border-b-2 border-dashed border-pink-100 pb-4">
                        <div>
                            <span class="bg-gradient-to-r from-pink-400 to-rose-400 text-white text-xs font-black px-3.5 py-1 rounded-full uppercase tracking-wider shadow-sm">${data.tag}</span>
                            <h2 class="text-xl md:text-2xl font-black text-rose-900 mt-2 font-cute">${data.date} - ${data.title}</h2>
                        </div>
                        <span class="text-xs md:text-sm font-bold bg-amber-50 border border-amber-200 text-amber-900 px-3.5 py-1.5 rounded-2xl flex items-center gap-1.5 shadow-sm">
                            <span>🌾</span>
                            <span>${data.theme}</span>
                        </span>
                    </div>

                    ${accommodationHtml}

                    <div class="space-y-5">
                        ${data.items.map((item, idx) => {
                            const startTime = new Date(item.start);
                            const endTime = new Date(item.end);
                            const isCurrentActive = (now >= startTime && now <= endTime);

                            return `
                                <div class="cute-card p-4 md:p-5 relative overflow-hidden ${isCurrentActive ? 'current-active-item' : ''}">
                                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-2.5">
                                        <div class="flex items-center gap-3">
                                            <span class="${isCurrentActive ? 'bg-gradient-to-r from-rose-500 to-pink-500 text-white font-black animate-pulse shadow-md' : 'bg-gradient-to-r from-amber-300 to-yellow-300 text-amber-950 font-black'} text-sm md:text-base px-3.5 py-1.5 rounded-xl flex items-center gap-1.5 shadow-sm tracking-wide">
                                                <span>⏰</span> <span>${item.time}</span>
                                            </span>
                                            <h3 class="font-black text-base md:text-lg text-rose-900 flex items-center gap-1.5 font-cute">
                                                <span>${idx % 2 === 0 ? '🐷' : '🐭'}</span>
                                                <span>${item.name}</span>
                                            </h3>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            ${isCurrentActive ? '<span class="text-xs font-black bg-rose-500 text-white px-3 py-1 rounded-lg shadow-md animate-bounce">🔥 進行中</span>' : ''}
                                            <span class="text-xs font-bold text-gray-500 bg-gray-100/80 px-2.5 py-1 rounded-lg border border-gray-200">
                                                ⌛ ${item.duration}
                                            </span>
                                        </div>
                                    </div>

                                    <div class="${isCurrentActive ? 'bg-rose-100/90 border-rose-300' : 'bg-pink-50/70 border-pink-100'} p-3 rounded-2xl border mb-2">
                                        <p class="text-xs md:text-sm font-bold text-rose-900 flex items-center gap-1">
                                            <span>✨ 必看亮點：</span>${item.highlight}
                                        </p>
                                    </div>

                                    <p class="text-xs md:text-sm text-gray-600 leading-relaxed font-bold mb-3">${item.desc}</p>

                                    <!-- 地圖即時預覽窗格 -->
                                    <div class="w-full h-48 md:h-56 rounded-2xl overflow-hidden border-2 border-pink-200/80 shadow-inner bg-rose-50/30">
                                        <iframe 
                                            width="100%" 
                                            height="100%" 
                                            frameborder="0" 
                                            scrolling="no" 
                                            marginheight="0" 
                                            marginwidth="0" 
                                            loading="lazy"
                                            src="https://maps.google.com/maps?q=${item.mapQuery}&hl=zh-TW&z=15&output=embed"
                                            class="w-full h-full border-0">
                                        </iframe>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function openModal(type) {
            const backdrop = document.getElementById('modal-backdrop');
            const body = document.getElementById('modal-body');

            if (type === 'pass-modal') {
                body.innerHTML = `
                    <div class="text-center mb-5">
                        <span class="text-4xl">🎫 🚅</span>
                        <h3 class="text-xl md:text-2xl font-black text-rose-900 font-cute mt-2">JR 山陽-山陰 7日 Pass 健檢報告</h3>
                        <p class="text-xs text-rose-600 font-bold mt-1">建議啟用區間：12/25 ➔ 12/31 (共 7 天)</p>
                    </div>
                    
                    <div class="space-y-3.5 text-xs md:text-sm text-gray-700">
                        <div class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-4">
                            <h4 class="font-black text-emerald-900 text-sm md:text-base mb-1 flex items-center gap-1 font-cute">
                                <span>💰</span> 節省費用試算 (極度划算！)
                            </h4>
                            <p class="font-bold"><strong>7日券票價：</strong>約 23,000 日圓</p>
                            <p class="font-bold"><strong>原價單買估算：</strong>超過 42,000 日圓</p>
                            <p class="text-emerald-700 font-black text-sm mt-1.5 bg-emerald-100/70 p-2 rounded-xl">👉 每人預計直接省下約 19,000 日圓！買到賺到！</p>
                        </div>

                        <div class="bg-pink-50/60 border-2 border-pink-200 rounded-2xl p-4 space-y-1.5">
                            <h4 class="font-black text-rose-900 flex items-center gap-1 font-cute">
                                <span>🚃</span> Pass 涵蓋的高額車資明細：
                            </h4>
                            <ul class="list-disc list-inside space-y-1 text-xs font-bold text-gray-600">
                                <li>12/25 岡山 ➔ 廣島（新幹線約 6,500円）</li>
                                <li>12/26 廣島 ↔ 忠海（新幹線+JR約 3,000円）</li>
                                <li>12/27 廣島 ↔ 岩國（JR快速約 1,600円）</li>
                                <li>12/28 廣島 ➔ 岡山 ➔ 鳥取（新幹線+特急超級因幡約 10,500円）</li>
                                <li>12/29 鳥取 ↔ 安來 ↔ 出雲市（特急超級松風/雲海約 9,000円）</li>
                                <li>12/30 鳥取 ➔ 岡山（特急超級因幡約 5,700円）</li>
                                <li>12/31 岡山 ↔ 姬路（新幹線約 6,500円）</li>
                            </ul>
                        </div>

                        <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4">
                            <h4 class="font-black text-amber-900 mb-1 flex items-center gap-1 font-cute">
                                <span>💡</span> 貼心搭車提醒：
                            </h4>
                            <p class="text-xs text-amber-900 font-bold">12/29 鳥取至出雲路線，持 Pass 可直接免費搭乘特急列車指定席，建議提前在 JR 綠色窗口或售票機劃位以確保舒適座位！</p>
                        </div>
                    </div>
                `;
            } else if (type === 'url-modal') {
                body.innerHTML = `
                    <div class="text-center mb-5">
                        <span class="text-4xl">🏨 🌸</span>
                        <h3 class="text-xl md:text-2xl font-black text-rose-900 font-cute mt-2">${urlHighlights.title}</h3>
                    </div>
                    
                    <div class="space-y-3 mb-6">
                        ${urlHighlights.highlights.map(h => `
                            <div class="bg-pink-50 border-2 border-pink-200 rounded-2xl p-3 text-xs md:text-sm font-bold text-rose-900 flex items-center gap-2">
                                <span>🐭</span>
                                <span>${h}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="text-center">
                        <a href="https://share.google/dfE5irsdLeVbQB8vG" target="_blank" class="inline-flex items-center gap-2 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-black px-6 py-3 rounded-2xl transition shadow-lg text-sm border-2 border-white">
                            <span>開啟原始 Google 連結</span>
                            <span>↗️</span>
                        </a>
                    </div>
                `;
            }

            backdrop.classList.remove('hidden');
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            backdrop.classList.add('hidden');
        }

        document.getElementById('modal-backdrop').addEventListener('click', (e) => {
            if (e.target.id === 'modal-backdrop') {
                closeModal();
            }
        });
    </script>
</body>
</html>

                        start: "2027-01-01T13:30:00",
                        end: "2027-01-01T17:00:00",
                        name: "吉備津神社與木造大回廊",
                        type: "spot",
                        highlight: "全長 398 公尺依山而建的古樸木造大回廊。",
                        desc: "桃太郎傳說發源地，新年初詣氣氛祥和熱絡。",
                        mapQuery: "Kibitsu+Shrine",
                        duration: "停留約 3.5 小時"
                    }
                ]
            },
            {
                day: 9,
                date: "01/02",
                dateKey: "2027-01-02",
                title: "倉敷美觀地區慢活漫步",
                tag: "老街散策",
                theme: "白壁土藏與運河川舟",

                items: [
                    {
                        time: "上午 09:30 - 下午 03:00",
                        start: "2027-01-02T09:30:00",
                        end: "2027-01-02T15:00:00",
                        name: "倉敷美觀地區",
                        type: "spot",
                        highlight: "白壁土藏群、柳樹水畔與生活道具選品小店。",
                        desc: "江戶風情建築保存完好，適合細細漫步於巷弄間品嚐甜點與參訪選物店。",
                        mapQuery: "Kurashiki+Bikan+Historical+Quarter",
                        duration: "停留約 5.5 小時"
                    },
                    {
                        time: "下午 03:00 - 04:30",
                        start: "2027-01-02T15:00:00",
                        end: "2027-01-02T16:30:00",
                        name: "阿智神社俯瞰老街",
                        type: "spot",
                        highlight: "登上鶴形山頂俯瞰美觀地區全景。",
                        desc: "位於古老高台上的寧靜神社，視野遼闊祥和。",
                        mapQuery: "Achi+Shrine",
                        duration: "停留約 1.5 小時"
                    }
                ]
            },
            {
                day: 10,
                date: "01/03",
                dateKey: "2027-01-03",
                title: "伴手禮採集 · 平安賦歸",
                tag: "歸途",
                theme: "滿載回憶順利返家",
                accommodation: "溫馨的家",
                items: [
                    {
                        time: "上午 10:00 - 下午 02:30",
                        start: "2027-01-03T10:00:00",
                        end: "2027-01-03T14:30:00",
                        name: "岡山市區整理與採購",
                        type: "spot",
                        highlight: "採購岡山白桃點心與伴手禮。",
                        desc: "把握時間採集伴手禮與享用午餐，準備前往機場。",
                        mapQuery: "Okayama+Station",
                        duration: "約 4.5 小時"
                    },
                    {
                        time: "下午 03:00",
                        start: "2027-01-03T15:00:00",
                        end: "2027-01-03T15:30:00",
                        name: "接駁巴士前往岡山機場",
                        type: "transport",
                        highlight: "由岡山站西口搭車直達機場。",
                        desc: "於岡山站西口 21 號月台搭乘機場巴士直達機場。",
                        mapQuery: "Okayama+Airport",
                        duration: "車程約 30 分鐘"
                    },
                    {
                        time: "下午 05:55",
                        start: "2027-01-03T17:55:00",
                        end: "2027-01-03T23:59:59",
                        name: "岡山機場 (OKJ) 起飛返台",
                        type: "spot",
                        highlight: "圓滿結束 10 天山陽山陰跨年之旅。",
                        desc: "辦理安檢與登機，搭乘 17:55 班機返抵台灣。",
                        mapQuery: "Okayama+Airport",
                        duration: "班機起飛"
                    }
                ]
            }
        ];

        const urlHighlights = {
            "title": "廣島住宿特點",
            "highlights": [
                "交通便捷：鄰近廣島車站，每日搭乘新幹線出行便捷。",
                "環境舒適：配置基礎家電，適合旅人放鬆與行李整頓。",
                "優質評價：住宿環境安靜整潔，性價比極高。"
            ]
        };

        // 護照簡約向量圖示
        const passportIconSvg = `
            <svg viewBox="0 0 100 125" class="w-4 h-5 inline-block flex-shrink-0 align-middle">
                <rect x="14" y="15" width="72" height="100" rx="6" fill="#2E403B" />
                <circle cx="50" cy="58" r="22" fill="none" stroke="#D1B888" stroke-width="3" />
                <ellipse cx="50" cy="58" rx="11" ry="22" fill="none" stroke="#D1B888" stroke-width="2.5" />
                <line x1="28" y1="58" x2="72" y2="58" stroke="#D1B888" stroke-width="2.5" />
                <text x="50" y="100" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="600" font-size="10" fill="#D1B888" letter-spacing="1">PASSPORT</text>
            </svg>
        `;

        // SIM 卡簡約向量圖示
        const simCardIconSvg = `
            <svg viewBox="0 0 100 125" class="w-4 h-5 inline-block flex-shrink-0 align-middle">
                <path d="M 16 120 L 84 120 A 4 4 0 0 0 88 116 L 88 12 A 4 4 0 0 0 84 8 L 38 8 L 12 34 L 12 116 A 4 4 0 0 0 16 120 Z" 
                      fill="#D8E2DC" stroke="#5A6B65" stroke-width="4" stroke-linejoin="round" />
                <rect x="26" y="50" width="48" height="44" rx="3" fill="#D1B888" stroke="#5A6B65" stroke-width="3" />
                <path d="M 40 50 L 40 70 L 74 70 M 54 50 L 54 70 M 40 70 L 40 94 M 60 70 L 60 94" 
                      fill="none" stroke="#5A6B65" stroke-width="2.5" stroke-linecap="square" />
            </svg>
        `;

        const defaultTodos = [
            { id: 1, text: "Eva 護照延期申辦", iconType: "passport", done: false },
            { id: 2, text: "訂地鐵周遊券", iconType: "train", done: false },
            { id: 3, text: "預約特色餐廳", iconType: "restaurant", done: false },
            { id: 4, text: "換日圓現鈔", iconType: "yen", done: false },
            { id: 5, text: "購入日本 eSIM", iconType: "sim", done: false }
        ];

        function getTodos() {
            const saved = localStorage.getItem('trip_todos_muji');
            if (!saved) {
                localStorage.setItem('trip_todos_muji', JSON.stringify(defaultTodos));
                return defaultTodos;
            }
            try {
                return JSON.parse(saved);
            } catch (e) {
                return defaultTodos;
            }
        }

        function saveTodos(todos) {
            localStorage.setItem('trip_todos_muji', JSON.stringify(todos));
        }

        function toggleTodo(id) {
            const todos = getTodos();
            const target = todos.find(t => t.id === id);
            if (target) {
                target.done = !target.done;
                saveTodos(todos);
                renderDayContent(currentDay);
            }
        }

        function addTodo() {
            const input = document.getElementById('new-todo-input');
            if (!input || !input.value.trim()) return;
            const todos = getTodos();
            todos.push({
                id: Date.now(),
                text: input.value.trim(),
                iconType: "pin",
                done: false
            });
            saveTodos(todos);
            renderDayContent(currentDay);
        }

        function deleteTodo(id) {
            let todos = getTodos();
            todos = todos.filter(t => t.id !== id);
            saveTodos(todos);
            renderDayContent(currentDay);
        }

        function getInitialDay() {
            const savedDay = localStorage.getItem('trip_last_active_day_muji');
            if (savedDay !== null && !isNaN(parseInt(savedDay))) {
                return parseInt(savedDay);
            }

            const now = new Date();
            const departureDate = new Date("2026-12-25T00:00:00");
            
            if (now < departureDate) {
                return 0;
            }

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            const matchedDay = itineraryData.find(d => d.dateKey === todayStr);
            return matchedDay ? matchedDay.day : 0;
        }

        let currentDay = getInitialDay();

        document.addEventListener('DOMContentLoaded', () => {
            updateCountdown();
            setInterval(updateCountdown, 1000);
            renderTabs();
            renderDayContent(currentDay);
        });

        function updateCountdown() {
            const departureDate = new Date("2026-12-25T14:35:00");
            const now = new Date();
            const diff = departureDate - now;
            
            const displayElem = document.getElementById('countdown-display');
            if (!displayElem) return;

            if (diff <= 0) {
                displayElem.innerHTML = `<span>旅程進行中</span>`;
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            const pad = (n) => String(n).padStart(2, '0');

            displayElem.innerHTML = `
                <span class="text-mujiMuted">倒數</span> 
                <span class="font-semibold">${days}</span> 天 
                <span class="font-semibold">${pad(hours)}</span> 時 
                <span class="font-semibold">${pad(minutes)}</span> 分 
                <span class="font-semibold">${pad(seconds)}</span> 秒
            `;
        }

        function renderTabs() {
            const container = document.getElementById('tab-container');
            const now = new Date();
            const departureDate = new Date("2026-12-25T00:00:00");
            const isBeforeTrip = (now < departureDate);

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            container.innerHTML = itineraryData.map(data => {
                const isRealToday = data.isPreparation ? isBeforeTrip : (data.dateKey === todayStr);
                const isSelected = (data.day === currentDay);
                
                let btnClasses = "tab-btn px-2 py-2 rounded-lg font-medium whitespace-nowrap flex flex-col items-center justify-center min-w-[65px] md:min-w-0 w-full border ";
                
                if (isSelected) {
                    btnClasses += "active-tab-style ";
                } else if (isRealToday) {
                    btnClasses += "today-blinking-tab ";
                } else {
                    btnClasses += "bg-white text-mujiText border-mujiBorder hover:bg-mujiPaper ";
                }

                return `
                    <button onclick="switchDay(${data.day})" 
                            id="tab-${data.day}"
                            class="${btnClasses}">
                        <span class="text-xs font-semibold leading-tight font-serif">
                            Day ${data.day}
                        </span>
                        <span class="text-[10px] text-mujiMuted tracking-tighter leading-tight mt-0.5">
                            ${data.date.split(' ')[0]}
                        </span>
                    </button>
                `;
            }).join('');
        }

        function switchDay(day) {
            currentDay = day;
            localStorage.setItem('trip_last_active_day_muji', day);
            renderTabs();
            renderDayContent(day);
        }

        function renderDayContent(day) {
            const data = itineraryData.find(d => d.day === day);
            const container = document.getElementById('day-content');
            const now = new Date();

            if (data.isTodoList) {
                const todos = getTodos();
                const completedCount = todos.filter(t => t.done).length;

                container.innerHTML = `
                    <div class="muji-card p-6 mb-6">
                        <div class="flex flex-wrap justify-between items-center gap-2 mb-6 border-b border-mujiBorder pb-4">
                            <div>
                                <span class="bg-mujiSubtle text-mujiMuted text-[11px] font-medium px-2.5 py-1 rounded">
                                    ${data.tag}
                                </span>
                                <h2 class="text-lg font-serif font-semibold text-mujiText mt-2">${data.title}</h2>
                            </div>
                            <span class="text-xs text-mujiMuted">
                                完成進度：<strong class="text-mujiText font-semibold">${completedCount} / ${todos.length}</strong>
                            </span>
                        </div>

                        <!-- 簡約輸入框 -->
                        <div class="mb-6 flex flex-col sm:flex-row gap-2">
                            <input type="text" id="new-todo-input" placeholder="輸入行前準備事項..." 
                                   class="flex-grow px-3.5 py-2 rounded-lg border border-mujiBorder text-xs text-mujiText bg-white focus:outline-none focus:border-mujiText"
                                   onkeypress="if(event.key === 'Enter') addTodo()">
                            <button onclick="addTodo()" class="bg-mujiText text-white text-xs font-medium px-4 py-2 rounded-lg transition hover:bg-black whitespace-nowrap">
                                新增
                            </button>
                        </div>

                        <!-- 待辦清單 -->
                        <div class="space-y-2.5" id="todo-list-container">
                            ${todos.map(todo => {
                                let iconElement = '<span class="text-xs text-mujiMuted">·</span>';
                                if (todo.iconType === 'passport') iconElement = passportIconSvg;
                                else if (todo.iconType === 'train') iconElement = '<span class="text-xs text-mujiMuted font-serif">JR</span>';
                                else if (todo.iconType === 'restaurant') iconElement = '<span class="text-xs text-mujiMuted">🍽</span>';
                                else if (todo.iconType === 'yen') iconElement = '<span class="text-xs text-mujiMuted font-serif">¥</span>';
                                else if (todo.iconType === 'sim') iconElement = simCardIconSvg;

                                return `
                                    <div class="p-3.5 border border-mujiBorder rounded-lg flex items-center justify-between gap-3 bg-white hover:border-[#D6D2C8] transition ${todo.done ? 'opacity-50' : ''}">
                                        <div class="flex items-center gap-3 flex-grow cursor-pointer" onclick="toggleTodo(${todo.id})">
                                            <div class="w-4 h-4 rounded border flex items-center justify-center text-[10px] ${todo.done ? 'bg-mujiText border-mujiText text-white' : 'border-mujiBorder bg-white'}">
                                                ${todo.done ? '✓' : ''}
                                            </div>
                                            <div class="flex items-center gap-2.5 text-xs text-mujiText ${todo.done ? 'line-through text-mujiMuted' : 'font-medium'}">
                                                <div class="w-5 flex items-center justify-center flex-shrink-0">
                                                    ${iconElement}
                                                </div>
                                                <span>${todo.text}</span>
                                            </div>
                                        </div>
                                        <button onclick="deleteTodo(${todo.id})" class="text-mujiMuted hover:text-mujiRed text-xs px-2 py-1 transition" title="刪除">
                                            ✕
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                return;
            }

            let accommodationHtml = '';
            if (data.accommodationUrl) {
                accommodationHtml = `
                    <div class="bg-mujiSubtle/60 border border-mujiBorder rounded-lg p-4 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                        <div>
                            <span class="text-[10px] uppercase tracking-wider text-mujiMuted block">ACCOMMODATION</span>
                            <h4 class="font-medium text-xs md:text-sm text-mujiText mt-0.5">${data.accommodation}</h4>
                        </div>
                        <button onclick="openModal('url-modal')" class="text-xs text-mujiText underline underline-offset-4 hover:text-mujiRed transition">
                            查看住宿重點
                        </button>
                    </div>
                `;
            } else if (data.accommodation) {
                accommodationHtml = `
                    <div class="bg-mujiSubtle/60 border border-mujiBorder rounded-lg p-3.5 mb-6">
                        <span class="text-[10px] uppercase tracking-wider text-mujiMuted block">ACCOMMODATION</span>
                        <h4 class="font-medium text-xs md:text-sm text-mujiText mt-0.5">${data.accommodation}</h4>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="muji-card p-6 mb-6">
                    <div class="flex flex-wrap justify-between items-baseline gap-2 mb-6 border-b border-mujiBorder pb-4">
                        <div>
                            <span class="text-xs text-mujiMuted font-serif tracking-wide block">${data.tag}</span>
                            <h2 class="text-lg md:text-xl font-serif font-semibold text-mujiText mt-1">${data.date} · ${data.title}</h2>
                        </div>
                        <span class="text-xs text-mujiMuted font-serif">
                            ${data.theme}
                        </span>
                    </div>

                    ${accommodationHtml}

                    <div class="space-y-6">
                        ${data.items.map((item, idx) => {
                            const startTime = new Date(item.start);
                            const endTime = new Date(item.end);
                            const isCurrentActive = (now >= startTime && now <= endTime);

                            return `
                                <div class="muji-card p-5 relative ${isCurrentActive ? 'current-active-item' : ''}">
                                    <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-1 mb-2 border-b border-mujiBorder pb-2">
                                        <div class="flex items-baseline gap-2.5">
                                            <span class="text-xs font-semibold tracking-wide ${isCurrentActive ? 'text-mujiRed' : 'text-mujiText'}">
                                                ${item.time}
                                            </span>
                                            <h3 class="font-medium text-sm md:text-base text-mujiText">
                                                ${item.name}
                                            </h3>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            ${isCurrentActive ? '<span class="text-[10px] font-medium bg-mujiRed text-white px-2 py-0.5 rounded">進行中</span>' : ''}
                                            <span class="text-[11px] text-mujiMuted">
                                                ${item.duration}
                                            </span>
                                        </div>
                                    </div>

                                    <div class="bg-mujiPaper px-3 py-2 rounded text-xs text-mujiText mb-2.5 border border-mujiBorder/50">
                                        <span class="text-mujiMuted font-medium">重點：</span>${item.highlight}
                                    </div>

                                    <p class="text-xs text-mujiMuted leading-relaxed mb-3">${item.desc}</p>

                                    <!-- 地圖內嵌視窗 -->
                                    <div class="w-full h-44 md:h-52 rounded-lg overflow-hidden border border-mujiBorder bg-mujiPaper">
                                        <iframe 
                                            width="100%" 
                                            height="100%" 
                                            frameborder="0" 
                                            scrolling="no" 
                                            marginheight="0" 
                                            marginwidth="0" 
                                            loading="lazy"
                                            src="https://maps.google.com/maps?q=${item.mapQuery}&hl=zh-TW&z=15&output=embed"
                                            class="w-full h-full border-0 grayscale-[25%] contrast-[95%]">
                                        </iframe>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function openModal(type) {
            const backdrop = document.getElementById('modal-backdrop');
            const body = document.getElementById('modal-body');

            if (type === 'pass-modal') {
                body.innerHTML = `
                    <div class="mb-4 pb-3 border-b border-mujiBorder">
                        <h3 class="text-base font-serif font-semibold text-mujiText">JR 山陽-山陰 7日 Pass 健檢明細</h3>
                        <p class="text-xs text-mujiMuted mt-0.5">適用期間：12/25 至 12/31（共 7 天）</p>
                    </div>
                    
                    <div class="space-y-4 text-xs text-mujiText">
                        <div class="bg-mujiPaper p-3.5 rounded-lg border border-mujiBorder">
                            <p class="mb-1"><strong>票券價格：</strong>約 23,000 日圓</p>
                            <p class="mb-1"><strong>單買原價：</strong>約 42,000 日圓</p>
                            <p class="text-mujiRed font-semibold mt-2 pt-2 border-t border-mujiBorder">每人預估節省約 19,000 日圓</p>
                        </div>

                        <div class="space-y-1.5">
                            <p class="font-medium">涵蓋主要長途車段：</p>
                            <ul class="list-disc list-inside space-y-1 text-mujiMuted leading-relaxed">
                                <li>12/25 岡山 ➔ 廣島（新幹線約 6,500円）</li>
                                <li>12/26 廣島 ↔ 忠海（新幹線+JR約 3,000円）</li>
                                <li>12/27 廣島 ↔ 岩國（JR快速約 1,600円）</li>
                                <li>12/28 廣島 ➔ 岡山 ➔ 鳥取（新幹線+特急約 10,500円）</li>
                                <li>12/29 鳥取 ↔ 安來 ↔ 出雲市（特急約 9,000円）</li>
                                <li>12/30 鳥取 ➔ 岡山（特急約 5,700円）</li>
                                <li>12/31 岡山 ↔ 姬路（新幹線約 6,500円）</li>
                            </ul>
                        </div>

                        <p class="text-mujiMuted text-[11px] pt-2 border-t border-mujiBorder">提醒：12/29 特急指定席建議提前於車站綠色窗口劃位。</p>
                    </div>
                `;
            } else if (type === 'url-modal') {
                body.innerHTML = `
                    <div class="mb-4 pb-3 border-b border-mujiBorder">
                        <h3 class="text-base font-serif font-semibold text-mujiText">${urlHighlights.title}</h3>
                    </div>
                    
                    <div class="space-y-2.5 mb-6 text-xs text-mujiText">
                        ${urlHighlights.highlights.map(h => `
                            <div class="p-2.5 bg-mujiPaper rounded border border-mujiBorder">
                                ${h}
                            </div>
                        `).join('')}
                    </div>

                    <div class="text-right">
                        <a href="https://share.google/dfE5irsdLeVbQB8vG" target="_blank" class="inline-block bg-mujiText hover:bg-black text-white text-xs font-medium px-4 py-2 rounded transition">
                            開啟 Google 原始連結
                        </a>
                    </div>
                `;
            }

            backdrop.classList.remove('hidden');
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            backdrop.classList.add('hidden');
        }

        document.getElementById('modal-backdrop').addEventListener('click', (e) => {
            if (e.target.id === 'modal-backdrop') {
                closeModal();
            }
        });
    </script>
</body>
</html>
